<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel CRM — User Management</title>
    <style>
        :root {
            /* Colors - Material Design Green Theme */
            --primary: #4CAF50;
            --on-primary: #FFFFFF;
            --primary-container: #81D4FA;
            --on-primary-container: #000000;
            --primary-fixed: #C8E6C9;
            --primary-fixed-dim: #A5D6A7;
            --on-primary-fixed: #000000;
            --on-primary-fixed-variant: #1B5E20;
            
            --secondary: #FFC107;
            --on-secondary: #000000;
            --secondary-container: #FFCC80;
            --on-secondary-container: #000000;
            
            --surface: #FFFFFF;
            --surface-dim: #F5F5F5;
            --surface-bright: #FFFFFF;
            --surface-container-lowest: #FAFAFA;
            --surface-container-low: #F0F0F0;
            --surface-container: #E0E0E0;
            --surface-container-high: #BDBDBD;
            --surface-container-highest: #9E9E9E;
            --on-surface: #212121;
            --on-surface-variant: #616161;
            --inverse-surface: #212121;
            --inverse-on-surface: #FFFFFF;
            --outline: #757575;
            --outline-variant: #B0B0B0;
            --error: #E53935;
            --on-error: #FFFFFF;
            --error-container: #FDEDEC;
            --on-error-container: #B00000;
            
            --background: #FAFAFA;
            --on-background: #212121;
            --surface-variant: #EEEEEE;
            --on-surface-variant-on: #616161;
            --surface-variant-lowest: #F5F5F5;
            --surface-variant-low: #F0F0F0;
            --surface-variant-high: #E0E0E0;
            --surface-variant-highest: #E0E0E0;
            
            --font-family: 'Roboto', 'DM Sans', sans-serif;
            --font-display-large: 48px;
            --font-headline-large: 32px;
            --font-title-large: 20px;
            --font-body-large: 16px;
            --font-label-large: 13px;
            
            --spacing-unit: 8px;
            --spacing-gutter: 24px;
            --spacing-mobile: 16px;
            --spacing-desktop: 64px;
            
            --shadow-level1: 0 1px 3px 0 rgba(0,0,0,0.12), 0 1px 2px 0 rgba(0,0,0,0.24);
            --shadow-level2: 0 2px 4px -1px rgba(0,0,0,0.2), 0 4px 5px -1px rgba(0,0,0,0.14);
            --shadow-level3: 0 4px 6px -1px rgba(0,0,0,0.1), 0 1px 3px 0 rgba(0,0,0,0.08);
            
            --radius-medium: 8px;
            --radius-small: 4px;
            --radius-tiny: 2px;
            
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-family), sans-serif;
            font-size: var(--font-body-large);
            color: var(--on-surface);
            background: var(--background);
            min-height: 100vh;
        }
        
        img { max-width: 100%; height: auto; display: block; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; }
        
        /* --- Toolbar --- */
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-gutter) var(--spacing-desktop);
            margin-bottom: var(--spacing-gutter);
            border-bottom: 1px solid var(--outline-variant);
        }
        
        .toolbar h2 {
            font-size: var(--font-headline-large);
            font-weight: 500;
            letter-spacing: -0.01em;
        }
        
        .toolbar-actions {
            display: flex;
            gap: var(--spacing-unit);
        }
        
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-tiny);
            padding: var(--spacing-unit) var(--spacing-gutter);
            background: var(--primary);
            color: var(--on-primary);
            font-size: var(--font-label-large);
            font-weight: 500;
            border-radius: var(--radius-small);
            transition: var(--transition-fast);
        }
        
        .btn-add:hover { background: #45a049; }
        
        .btn-add svg { width: 20px; height: 20px; fill: currentColor; }
        
        /* --- Users Table --- */
        
        .users-table {
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius-medium);
            overflow: hidden;
            box-shadow: var(--shadow-level2);
        }
        
        .users-table thead {
            background: var(--surface-dim);
            border-bottom: 1px solid var(--outline-variant);
        }
        
        .users-table th {
            padding: var(--spacing-gutter) var(--spacing-gutter) var(--spacing-unit) var(--spacing-gutter);
            font-size: var(--font-label-medium);
            font-weight: 500;
            color: var(--on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .users-table td {
            padding: var(--spacing-gutter) var(--spacing-gutter);
            font-size: var(--font-body-large);
            border-bottom: 1px solid var(--outline-variant);
            transition: var(--transition-fast);
        }
        
        .users-table tbody tr:hover td {
            background: var(--surface-variant);
        }
        
        /* --- User Row Actions --- */
        
        .user-actions {
            display: flex;
            gap: var(--spacing-tiny);
        }
        
        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-tiny);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--on-surface-variant);
            font-size: var(--font-body-small);
            transition: var(--transition-fast);
        }
        
        .action-btn:hover { background: var(--surface-variant); color: var(--primary); }
        .action-btn.delete:hover { background: rgba(229, 57, 53, 0.1); color: var(--error); }
        
        /* --- User Columns --- */
        
        .user-name { font-weight: 500; }
        .user-email { color: var(--on-surface-variant); font-size: var(--font-body-small); }
        .user-role { padding-left: var(--spacing-gutter); }
        .user-status { padding-left: var(--spacing-gutter); }
        
        /* --- Role Badge --- */
        
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-tiny);
            padding: var(--spacing-xtiny) var(--spacing-small);
            background: var(--surface);
            border: 1px solid var(--outline);
            border-radius: var(--radius-tiny);
            font-size: var(--font-label-small);
            font-weight: 500;
            color: var(--on-surface);
        }
        
        .role-badge.admin { background: rgba(156, 39, 176, 0.1); color: #9C27B0; }
        .role-badge.manager { background: rgba(255, 193, 7, 0.1); color: #FFC107; }
        .role-badge.staff { background: rgba(33, 150, 243, 0.1); color: #2196F3; }
        .role-badge.viewer { background: rgba(76, 175, 80, 0.1); color: #4CAF50; }
        
        /* --- Pagination --- */
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: var(--spacing-unit);
            padding: var(--spacing-gutter) 0;
            margin-top: var(--spacing-gutter);
        }
        
        .page-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-tiny);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--on-surface-variant);
            transition: var(--transition-fast);
        }
        
        .page-btn.active { background: var(--primary); color: var(--on-primary); }
        .page-btn:hover:not(.active) { background: var(--surface-variant); }
        
        /* --- Empty State --- */
        
        .empty-state {
            text-align: center;
            padding: var(--spacing-desktop) var(--spacing-mobile);
            color: var(--on-surface-variant);
        }
        
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--spacing-gutter);
            opacity: 0.5;
        }
        
        /* --- RESPONSIVE BREAKPOINTS --- */
        
        @media (min-width: 600px) {
            .toolbar { padding: var(--spacing-gutter) var(--spacing-gutter); }
            .users-table th, .users-table td { padding: var(--spacing-gutter) var(--spacing-gutter); }
        }
        
        @media (min-width: 960px) {
            .toolbar { padding: var(--spacing-gutter) var(--spacing-desktop); }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .btn-add, .action-btn { transition: none; }
        }
    </style>
</head>
<body>
    
    <!-- Empty State / Toolbar -->
    <div class="toolbar">
        <h2>Users</h2>
        <button class="btn-add">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add User

    </div>
    
    <!-- Users Table -->

                        <button class="action-btn" title="Edit" aria-label="Edit user">

                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1-.707 1.414L19.293 8H15.5a1.5 1.5 0 0 1 0-3h3.793l-.707-1.586a1 1 0 0 1 0-1.414L15.5 2.5a1 1 0 0 0-1.998-.002 1 1 0 0 0-.707.293l1.213 2.122 2.122 1.213a1 1 0 0 1 .293.707h-1.5a1 1 0 0 1 0-3H9.707l1.213-2.122 2.122-1.213a1 1 0 0 1 .707-.293 1 1 0 0 0 0-1.998 1 1 0 0 0-.293-.707z"/>
                            </svg>
                        </button>
                        <button class="action-btn delete" title="Delete" aria-label="Delete user">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        </table>
    </div>
    
    <!-- Pagination -->
    <div class="pagination">
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <button class="page-btn">...</button>

</body>
</html>
