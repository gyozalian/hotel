<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel CRM — Login Page</title>
    <style>
        :root {
            /* Colors - Material Design Green Theme */
            --primary: #4CAF50;
            --on-primary: #FFFFFF;
            --primary-container: #81D4FA;
            --on-primary-container: #000000;
            --primary-fixed: #C8E6C9;
            --primary-fixed-dim: #A5D6A7;
            --on-primary-fixed: #000000;
            --on-primary-fixed-variant: #1B5E20;
            
            --secondary: #FFC107;
            --on-secondary: #000000;
            --secondary-container: #FFCC80;
            --on-secondary-container: #000000;
            
            --surface: #FFFFFF;
            --surface-dim: #F5F5F5;
            --surface-bright: #FFFFFF;
            --surface-container-lowest: #FAFAFA;
            --surface-container-low: #F0F0F0;
            --surface-container: #E0E0E0;
            --surface-container-high: #BDBDBD;
            --surface-container-highest: #9E9E9E;
            --on-surface: #212121;
            --on-surface-variant: #616161;
            --inverse-surface: #212121;
            --inverse-on-surface: #FFFFFF;
            --outline: #757575;
            --outline-variant: #B0B0B0;
            --error: #E53935;
            --on-error: #FFFFFF;
            --error-container: #FDEDEC;
            --on-error-container: #B00000;
            
            --background: #FAFAFA;
            --on-background: #212121;
            --surface-variant: #EEEEEE;
            --on-surface-variant-on: #616161;
            --surface-variant-lowest: #F5F5F5;
            --surface-variant-low: #F0F0F0;
            --surface-variant-high: #E0E0E0;
            --surface-variant-highest: #E0E0E0;
            
            --font-family: 'Roboto', 'DM Sans', sans-serif;
            --font-display-large: 48px;
            --font-headline-large: 32px;
            --font-title-large: 20px;
            --font-body-large: 16px;
            --font-label-large: 13px;
            
            --spacing-unit: 8px;
            --spacing-gutter: 24px;
            --spacing-mobile: 16px;
            --spacing-desktop: 64px;
            
            --shadow-level1: 0 1px 3px 0 rgba(0,0,0,0.12), 0 1px 2px 0 rgba(0,0,0,0.24);
            --shadow-level2: 0 2px 4px -1px rgba(0,0,0,0.2), 0 4px 5px -1px rgba(0,0,0,0.14);
            --shadow-level3: 0 4px 6px -1px rgba(0,0,0,0.1), 0 1px 3px 0 rgba(0,0,0,0.08);
            
            --radius-medium: 8px;
            --radius-small: 4px;
            --radius-tiny: 2px;
            
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-family), sans-serif;
            font-size: var(--font-body-large);
            color: var(--on-surface);
            background: var(--background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        img { max-width: 100%; height: auto; display: block; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; }
        
        /* --- Container --- */
        
        .login-container {
            display: flex;
            width: 100%;
            max-width: 480px;
            padding: var(--spacing-desktop);
            background: var(--surface);
            border-radius: var(--radius-medium);
            box-shadow: var(--shadow-level3);
            flex-direction: column;
            align-items: center;
        }
        
        /* --- Logo / Brand --- */
        
        .login-brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-unit);
            margin-bottom: var(--spacing-gutter);
            width: 100%;
        }
        
        .login-icon {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-icon svg {
            width: 32px;
            height: 32px;
            fill: var(--on-primary);
        }
        
        .login-brand h1 {
            font-size: var(--font-display-large);
            font-weight: 400;
            letter-spacing: -0.02em;
        }
        
        .login-brand p {
            font-size: var(--font-body-medium);
            color: var(--on-surface-variant);
        }
        
        /* --- Form --- */
        
        .login-form {
            width: 100%;
            margin-bottom: var(--spacing-gutter);
        }
        
        .form-group {
            width: 100%;
            margin-bottom: var(--spacing-unit);
        }
        
        .form-label {
            display: block;
            font-size: var(--font-label-large);
            font-weight: 500;
            margin-bottom: var(--spacing-tiny);
            color: var(on-surface);
        }
        
        .form-input {
            width: 100%;
            padding: var(--spacing-unit) var(--spacing-gutter);
            background: var(--surface);
            border: 1px solid var(--outline);
            border-radius: var(--radius-small);
            font-size: var(--font-body-large);
            color: var(--on-surface);
            transition: var(--transition-fast);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--on-surface-variant);
        }
        
        /* --- Remember Me --- */
        
        .remember-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-unit);
            font-size: var(--font-body-small);
            color: var(--on-surface-variant);
            margin-bottom: var(--spacing-gutter);
            width: 100%;
        }
        
        .remember-input {
            accent-color: var(--primary);
        }
        
        /* --- Action Button --- */
        
        .login-button {
            width: 100%;
            padding: var(--spacing-unit) var(--spacing-gutter);
            background: var(--primary);
            color: var(--on-primary);
            font-size: var(--font-label-large);
            font-weight: 500;
            border-radius: var(--radius-small);
            margin-bottom: var(--spacing-gutter);
            transition: var(--transition-fast);
        }
        
        .login-button:hover {
            background: #45a049;
        }
        
        .login-button:focus-visible {
            outline: 2px solid var(--on-primary);
            outline-offset: 2px;
        }
        
        /* --- Links --- */
        
        .login-links {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: var(--font-body-small);
            color: var(--on-surface-variant);
            margin-top: var(--spacing-gutter);
        }
        
        .login-links a:hover {
            color: var(--primary);
        }
        
        /* --- Divider --- */
        
        .divider {
            display: flex;
            align-items: center;
            gap: var(--spacing-gutter);
            margin: var(--spacing-gutter) 0;
            width: 100%;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--outline-variant);
        }
        
        .divider span {
            font-size: var(--font-body-small);
            color: var(--on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        /* --- Google Sign-in --- */
        
        .google-signin {
            width: 100%;
            padding: var(--spacing-unit) var(--spacing-gutter);
            background: var(--surface);
            border: 1px solid var(--outline);
            border-radius: var(--radius-small);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-unit);
            font-size: var(--font-body-large);
            color: var(--on-surface);
            margin-bottom: var(--spacing-gutter);
            transition: var(--transition-fast);
        }
        
        .google-signin:hover {
            border-color: var(--primary);
        }
        
        .google-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        
        /* --- RESPONSIVE BREAKPOINTS --- */
        
        @media (min-width: 600px) {
            .login-container { max-width: 560px; padding: calc(var(--spacing-desktop) * 1.5); }
        }
        
        @media (min-width: 960px) {
            .login-container { max-width: 640px; padding: var(--spacing-desktop); }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .login-button { transition: none; }
        }
    </style>
</head>
<body>
    
    <div class="login-container">
        
        <!-- Brand -->
        <div class="login-brand">
            <div class="login-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="9.01" y2="9.01"/>
                </svg>
            </div>
            <div>
                <h1>Hotel CRM</h1>
                <p>Sign in to manage your property</p>
            </div>
        </div>
        
        <!-- Form -->
        <form class="login-form" action="#" method="POST">
            <div class="form-group">
                <label class="form-label" for="email">Email address</label>
                <input class="form-input" type="email" id="email" placeholder="you@domain.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="remember-group">
                <input class="remember-input" type="checkbox" id="remember">
                <span>Remember me</span>
            </div>
            
            <button class="login-button" type="submit">Sign In</button>
        </form>
        
        <!-- Links -->
        <div class="login-links">
            <a href="#">Forgot password?</a>
            <a href="#">Create account</a>
        </div>
        
        <!-- Divider -->
        <div class="divider">
            <span>Or continue with</span>
        </div>
        
        <!-- Google Sign-in -->
        <div class="google-signin">
            <svg class="google-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M22.54 12.45c-.77-.79-2.03-.79-2.8 0l-3.13 3.12 1.18 1.18c.45.45.45 1.19 0 1.64l-2.35 2.35a9.96 9.96 0 0 1-1.42 1.31l-.72 2.88a2.96 2.96 0 0 0 .05 4.23l2.88-.72a9.95 9.95 0 0 1 1.31-1.42l2.35-2.35c.45-.45.45-1.19 0-1.64l-3.13-3.13a1.72 1.72 0 0 0-1.63 0L7.5 18.56 3.07 14.13a1.72 1.72 0 0 0-1.63 0l-3.13 3.12c-.45.45-.45 1.19 0 1.64l3.12 3.13a9.95 9.95 0 0 1-1.31 1.42l.72 2.88a2.95 2.95 0 0 0 4.23.05l2.88-.72c.78-.18 1.52-.5 2.15-1.22l3.13-3.13c.44-.45.44-1.19 0-1.64L22.54 12.45zM7.5 13c1.38 0 2.53-.18 3.54-.53.53-.18.53-.46.06-.97-.47-.5-.97-.06-1.44.13-1.9.33l3.48 3.48c.2.2.5.2.71 0l3.47-3.47c.33-.33.13-1.0.13-1.39-.01-.32-.32-.78-.71-.78-.39 0-.78.39-.39.77l-1.85 1.85c-.2.2-.5.2-.71 0-.33-.33-.33-1.01 0-1.34l1.86-1.86a1.72 1.72 0 0 0 0-1.22z"/>
            </svg>
            Continue with Google
        </div>
        
    </div>
    
</body>
</html>
